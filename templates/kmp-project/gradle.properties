#Kotlin
kotlin.code.style=official
# 4 GB, not 2: the Kotlin/Native release link (`linkReleaseFrameworkIosArm64`) OOMs the
# compiler with a 2 GB heap. Raise this, or pass -Xmx6144M for that task alone.
kotlin.daemon.jvmargs=-Xmx4096M
ksp.useKSP2=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8

#Android
# BuildKonfig flavor configuration
buildkonfig.flavor=develop
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
